name: Publish

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/CI.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - name: Verify checked revision is still current
        run: |
          git fetch origin "$RELEASE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Publish eligible workspaces
        id: release
        run: node scripts/publish.ts
      - name: Commit changelogs for successfully published versions
        if: ${{ !cancelled() && (steps.release.outcome == 'success' || steps.release.outcome == 'failure') }}
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Next cycle'
          git fetch origin "$RELEASE_BRANCH"
          git rebase FETCH_HEAD
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
